services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hidra
      POSTGRES_USER: olympus
      POSTGRES_PASSWORD: olympus
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-argos-db.sql:/docker-entrypoint-initdb.d/init-argos-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olympus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  hidra:
    build:
      context: ./docker/php
    volumes:
      - ./hidra:/var/www/html
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: hidra
      DB_USERNAME: olympus
      DB_PASSWORD: olympus
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  argos:
    build:
      context: ./docker/php
    volumes:
      - ./argos:/var/www/html
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: argos
      DB_USERNAME: olympus
      DB_PASSWORD: olympus
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
