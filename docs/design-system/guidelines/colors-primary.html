<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;font-family:var(--font-sans);background:var(--bg-surface)">
<div style="display:flex;gap:8px">
  <div style="flex:1;height:80px;border-radius:8px;background:var(--primary-50)"></div>
  <div style="flex:1;height:80px;border-radius:8px;background:var(--primary-100)"></div>
  <div style="flex:1;height:80px;border-radius:8px;background:var(--primary-300)"></div>
  <div style="flex:1;height:80px;border-radius:8px;background:var(--primary-500)"></div>
  <div style="flex:1;height:80px;border-radius:8px;background:var(--primary-600)"></div>
  <div style="flex:1;height:80px;border-radius:8px;background:var(--primary-700)"></div>
</div>
<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--text-muted)">
  <span>50</span><span>100</span><span>300</span><span>500</span><span>600</span><span>700</span>
</div>
</body></html>
