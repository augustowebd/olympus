<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;font-family:var(--font-sans);background:var(--bg-surface)">
<div style="display:flex;gap:6px">
  <div style="flex:1;height:64px;border-radius:6px;background:var(--n-0);border:1px solid var(--border-subtle)"></div>
  <div style="flex:1;height:64px;border-radius:6px;background:var(--n-100)"></div>
  <div style="flex:1;height:64px;border-radius:6px;background:var(--n-300)"></div>
  <div style="flex:1;height:64px;border-radius:6px;background:var(--n-500)"></div>
  <div style="flex:1;height:64px;border-radius:6px;background:var(--n-700)"></div>
  <div style="flex:1;height:64px;border-radius:6px;background:var(--n-900)"></div>
</div>
</body></html>
