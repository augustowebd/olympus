<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;font-family:var(--font-sans);background:var(--bg-page);display:flex;gap:16px">
<div style="width:120px;height:100px;border-radius:var(--radius-sm);background:var(--bg-surface);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted)">sm</div>
<div style="width:120px;height:100px;border-radius:var(--radius-md);background:var(--bg-surface);box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted)">md</div>
<div style="width:120px;height:100px;border-radius:var(--radius-lg);background:var(--bg-surface);box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted)">lg</div>
</body></html>
