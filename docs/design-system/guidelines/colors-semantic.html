<!-- @dsCard group="Colors" viewport="700x180" subtitle="Semantic — warning / danger / info" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;font-family:var(--font-sans);background:var(--bg-surface);display:flex;gap:16px">
<div style="flex:1;text-align:center"><div style="height:56px;border-radius:8px;background:var(--warning-500)"></div><span style="font-size:12px;color:var(--text-secondary)">Warning</span></div>
<div style="flex:1;text-align:center"><div style="height:56px;border-radius:8px;background:var(--danger-500)"></div><span style="font-size:12px;color:var(--text-secondary)">Danger</span></div>
<div style="flex:1;text-align:center"><div style="height:56px;border-radius:8px;background:var(--primary-500)"></div><span style="font-size:12px;color:var(--text-secondary)">Info</span></div>
</body></html>
